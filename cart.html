<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexWear - Shopping Cart</title>
    
    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@700&display=swap" rel="stylesheet">
    
    <!-- Boxicons CDN -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/boxicons/2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-[Jost]">

    <header>
        <div class="logo">
            <h1>FlexWear</h1>
        </div>
        <div class="backtohome">
            <h3 class="font-bold"><a href="index.html">Back To Home</a></h3>
        </div>
    </header>

    <!-- Mobile Navigation -->
    <div id="mobile-nav" class="hidden bg-white shadow-md p-4">
        <a href="#home" class="block py-2">Home</a>
        <a href="#products" class="block py-2">Products</a>
        <a href="#about" class="block py-2">About Us</a>
        <a href="#blog" class="block py-2">Fashion Blog</a>
        <a href="#contact" class="block py-2">Contact Us</a>
    </div>

    <!-- Cart Section -->
    <div class="max-w-2xl mx-auto bg-white shadow-lg rounded-lg p-6 mt-8">
        <h2 class="text-2xl font-bold mb-4 text-center">🛒 Your Shopping Cart</h2>
        
        <div id="cart-items" class="space-y-4">
            <!-- Cart Items will be injected here -->
        </div>

        <!-- Cart Summary -->
        <div class="mt-5 border-t pt-4 flex justify-between">
            <p class="text-lg font-semibold">Total Items: <span id="total-items">0</span></p>
            <p class="text-lg font-semibold">Total Price: $<span id="total-price">0.00</span></p>
        </div>

        <button onclick="clearCart()" class="mt-4 w-full bg-red-500 text-white py-2 px-4 rounded-lg hover:bg-red-600 transition">
            🗑️ Clear Cart
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
